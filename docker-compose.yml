services:
  app:
    build: .
    container_name: yt-automation-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - "${OUTPUT_DIR_HOST:-./output}:/app/output"
    networks:
      - infra
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      infra-postgres:
        condition: service_healthy
      infra-n8n:
        condition: service_started

networks:
  infra:
    external: true
    name: ${DOCKER_NETWORK:-infra_default}
